[package]
name = "grazzark"
version = "0.1.0"
edition = "2021"
description = "A first-person ASCII roguelike: descend ten levels, claim the Amulet of GRAZZARK, return alive."

[dependencies]
crossterm = "0.27"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
